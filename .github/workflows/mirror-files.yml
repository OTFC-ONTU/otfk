name: Mirror legacy files

# Ручний запуск черги file_mirrors на сервері (otfk:mirror-files) — коли cron schedule:run
# на хостингу ще не налаштований або чергу треба обробити одразу великою порцією.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Скільки файлів обробити за запуск
        default: '500'
        required: true
      verify:
        description: Перевірити готові файли (--verify)
        type: boolean
        default: false
      retry_failed:
        description: Повернути failed у чергу (--retry-failed)
        type: boolean
        default: false

concurrency:
  group: mirror-files-${{ github.ref_name == 'prod' && 'plesk' || 'test' }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # Сервер обирається гілкою запуску, як у deploy.yml: prod → Plesk, інші → тестовий хостинг.
    environment: ${{ github.ref_name == 'prod' && 'plesk' || 'test' }}
    steps:
      - name: Check target
        if: ${{ github.ref_name == 'prod' && vars.DEPLOY_TARGET != 'plesk' }}
        run: |
          echo "::error title=Mirror::Середовище plesk не налаштоване (DEPLOY_TARGET=plesk, секрети REMOTE_*)."
          exit 1

      - name: Build command
        id: cmd
        env:
          LIMIT: ${{ inputs.limit }}
          VERIFY: ${{ inputs.verify }}
          RETRY: ${{ inputs.retry_failed }}
        run: |
          [[ "$LIMIT" =~ ^[0-9]{1,5}$ ]] || { echo "limit must be a number"; exit 1; }
          args="--limit=$LIMIT"
          [ "$VERIFY" = "true" ] && args="$args --verify"
          [ "$RETRY" = "true" ] && args="$args --retry-failed"
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.REMOTE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.REMOTE_PORT || 22 }} -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      - name: Run otfk:mirror-files
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.REMOTE_PORT || 22 }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} "
            set -e
            cd ${{ secrets.REMOTE_PATH }}
            if [ -n \"${{ vars.REMOTE_PHP_BIN }}\" ]; then export PATH=\"${{ vars.REMOTE_PHP_BIN }}:\$HOME/bin:\$PATH\"; fi
            php artisan otfk:mirror-files ${{ steps.cmd.outputs.args }} -v
          "
