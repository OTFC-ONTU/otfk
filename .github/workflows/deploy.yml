name: Deploy to production

# prod → Plesk (new.otfk.od.ua): job deploy-plesk збирає фронтенд і публікує гілку
# plesk-build, яку забирає Laravel Toolkit у Plesk (SSH там chroot без PHP 8.3).
# master та ручний запуск інших гілок → тестовий хостинг по SSH (job deploy).
on:
  push:
    branches: [master, prod]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name == 'prod' && 'plesk' || 'test' }}
  cancel-in-progress: false

jobs:
  # Шлюз: без зелених тестів і чистого composer audit для цього ж SHA викладка не стартує.
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd, zip, intl, fileinfo
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit --no-interaction --locked
      - run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  deploy-plesk:
    if: ${{ github.ref_name == 'prod' }}
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # plesk-build = дерево prod + public/build (у prod він у .gitignore). Коміт має
      # батьками попередній plesk-build і перевірений SHA prod — гілка лише рухається
      # вперед, тож Git у Plesk тягне її без force. Push через GITHUB_TOKEN не запускає
      # інших workflow.
      - name: Publish plesk-build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/build
          tree=$(git write-tree)
          parents="-p ${{ github.sha }}"
          if git fetch --quiet origin plesk-build; then
            parents="-p $(git rev-parse FETCH_HEAD) $parents"
          fi
          commit=$(git commit-tree "$tree" $parents -m "build: prod ${{ github.sha }}")
          git push origin "$commit:refs/heads/plesk-build"
          echo "::notice title=plesk-build::$commit (prod ${{ github.sha }})"

      # Розгортання у Plesk запускає вебхук Git-репозиторію Laravel Toolkit
      # (секрет PLESK_DEPLOY_WEBHOOK). Без нього — «Розгорнути» вручну в Plesk.
      - name: Trigger Plesk deployment
        env:
          WEBHOOK: ${{ secrets.PLESK_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice title=Plesk::Секрет PLESK_DEPLOY_WEBHOOK не заданий — розгорніть plesk-build у Plesk вручну."
            exit 0
          fi
          curl -fsS -X POST --retry 3 "$WEBHOOK" > /dev/null

  deploy:
    if: ${{ github.ref_name != 'prod' }}
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      # На хостингу немає node, тому фронтенд збираємо тут
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.REMOTE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.REMOTE_PORT || 22 }} -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      # Репозиторій публічний — сервер тягне код по https без deploy key.
      # Встановлюється саме той SHA, для якого пройшли тести і зібрано фронтенд
      # (не «поточний master», який міг піти далі за час збірки).
      - name: Pull code and install dependencies
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.REMOTE_PORT || 22 }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} '
            set -e
            cd ${{ secrets.REMOTE_PATH }}
            git fetch origin ${{ github.sha }}
            git reset --hard ${{ github.sha }}
            composer install --no-dev --optimize-autoloader --no-interaction
          '

      # public/build у .gitignore (збірка живе тільки в CI), тому заливаємо окремо
      - name: Upload built assets
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.REMOTE_PORT || 22 }}" \
            public/build/ \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:${{ secrets.REMOTE_PATH }}/public/build/

      - name: Migrate and rebuild caches
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.REMOTE_PORT || 22 }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} '
            set -e
            cd ${{ secrets.REMOTE_PATH }}
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
          '

      # HTTP smoke-перевірка SEO вже викладеного сайту ззовні, з раннера
      # (docs/seo-plan.md, етап 1): статуси ключових сторінок, noindex/canonical,
      # robots.txt, sitemap.xml, 404. Параметри — змінні репозиторію:
      # SEO_SMOKE_BASE_URL (без неї крок пропускається з попередженням) і
      # SEO_SMOKE_EXPECT (closed для тестового хостингу — типово, indexable
      # для otfk.od.ua). Провал робить запуск червоним, але викладку не відкочує.
      - name: SEO smoke check skipped
        if: ${{ vars.SEO_SMOKE_BASE_URL == '' }}
        run: echo "::notice title=SEO smoke::Змінна SEO_SMOKE_BASE_URL не задана — HTTP-перевірку пропущено."

      - uses: shivammathur/setup-php@v2
        if: ${{ vars.SEO_SMOKE_BASE_URL != '' }}
        with:
          php-version: '8.3'
          extensions: mbstring, curl, dom, libxml, intl, fileinfo
          coverage: none

      - name: SEO smoke check
        if: ${{ vars.SEO_SMOKE_BASE_URL != '' }}
        env:
          SEO_SMOKE_BASE_URL: ${{ vars.SEO_SMOKE_BASE_URL }}
          SEO_SMOKE_EXPECT: ${{ vars.SEO_SMOKE_EXPECT || 'closed' }}
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan otfk:seo-smoke --base="$SEO_SMOKE_BASE_URL" --expect="$SEO_SMOKE_EXPECT" --sitemap-sample=5 --timeout=20 --retries=3 --retry-delay=3000
